# Dependency updates.
#
# Weekly rather than daily: this is a small project, and a bot that opens five
# pull requests every morning gets muted, which is strictly worse than one that
# opens three on Monday.
#
# Grouping matters more than frequency here. An ungrouped Cargo update on a
# Tauri app produces a dozen PRs that each bump one transitive crate and each
# cost a full macOS CI run.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Tauri's crates are versioned together and break together. Splitting them
      # across PRs produces combinations that were never tested upstream.
      tauri:
        patterns: ['tauri', 'tauri-*']
      patch-and-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ['next', '@next/*', 'eslint-config-next']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      blocknote:
        patterns: ['@blocknote/*']
      patch-and-minor:
        update-types: [minor, patch]

  # Actions pinned by tag drift silently, and a compromised action is a supply
  # chain problem in a project whose whole claim is about where data goes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
