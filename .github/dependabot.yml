# Dependency updates.
#
# Weekly rather than daily: this is a small project, and a bot that opens five
# pull requests every morning gets muted, which is strictly worse than one that
# opens three on Monday.
#
# Grouping matters more than frequency here. An ungrouped Cargo update on a
# Tauri app produces a dozen PRs that each bump one transitive crate and each
# cost a full macOS CI run.
#
# The grouping has to name majors explicitly, and for a year it did not. A
# group restricted to `update-types: [minor, patch]` does not match a major, so
# every major fell through ungrouped and took its own pull request. That is how
# 31 August 2026 produced ten PRs in three minutes: five Cargo majors, two
# Action majors, one ungrouped lucide-react major, and two grouped ones.
# Dependabot puts a dependency in the first group it matches, so the catch-all
# `major` group goes last, after the ones that select by name.
#
# `cooldown` stops Dependabot proposing a version that pnpm will then refuse to
# install. pnpm 11 enforces `minimumReleaseAge` (see pnpm-workspace.yaml), so
# without this the bot would eventually open a pull request whose CI cannot
# pass, for a reason nothing in the PR explains.

version: 2
updates:
  - package-ecosystem: cargo
    # The workspace root, not `frontend/src-tauri`, which is one of its two
    # members. Dependabot copies only this directory into its temporary tree,
    # so pointing it at a member left the root manifest behind — and from
    # 4 September, when `whisper-rs` moved into `[workspace.dependencies]` so
    # it could not be declared three times and split, every crate in the
    # ecosystem started failing to parse:
    #
    #   error inheriting `whisper-rs` from workspace root manifest's
    #   `workspace.dependencies.whisper-rs`
    #   Caused by: failed to find a workspace root
    #
    # That is the same `dependency_file_not_resolvable` symptom the workspace
    # move was meant to end, arrived at from the opposite direction and hitting
    # more crates than before. Cargo workspaces want the root here; from it
    # Dependabot finds both members on its own, `llama-helper` included, which
    # had no coverage at all while this pointed at the other one.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # `llama-cpp-2` is pinned with `=` in llama-helper/Cargo.toml because it
      # breaks its API across patch releases, and Dependabot will happily edit
      # an exact pin, which defeats the point of writing one.
      #
      # Measured, not feared. The first proposal after this ecosystem could see
      # llama-helper at all — 7 September 2026, pull request #22 — moved it from
      # 0.1.146 to 0.1.154 and stopped compiling on all three platforms:
      #
      #   error[E0277]: the trait bound `f32: TryFrom<u32>` is not satisfied
      #   error[E0061]: this function takes 7 arguments but 8 were supplied
      #   error[E0061]: this function takes 5 arguments but 4 were supplied
      #
      # It tracks llama.cpp, which does not promise a stable interface. Moving
      # it is a deliberate piece of work with its own commit, its own build on
      # each platform's feature set, and a summary generated afterwards to
      # prove the sidecar still answers. It is not a weekly patch.
      - dependency-name: llama-cpp-2
    groups:
      # Tauri's crates are versioned together and break together. Splitting them
      # across PRs produces combinations that were never tested upstream.
      tauri:
        patterns: ['tauri', 'tauri-*']
      patch-and-minor:
        update-types: [minor, patch]
      major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      next:
        patterns: ['next', '@next/*', 'eslint-config-next']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      blocknote:
        patterns: ['@blocknote/*']
      patch-and-minor:
        update-types: [minor, patch]
      major:
        update-types: [major]

  # Actions pinned by tag drift silently, and a compromised action is a supply
  # chain problem in a project whose whole claim is about where data goes. One
  # group, because they get reviewed in one sitting or not at all.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
