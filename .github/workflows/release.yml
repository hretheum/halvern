name: "Release"

on:
  workflow_dispatch:

# Prevent duplicate releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases, fail instead

jobs:
  # STEP 1: Create draft release first
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all tags

      # The updater compares semver. A version it cannot parse is not a loud
      # failure — the update check simply offers nothing, forever, on machines
      # nobody is watching. This step used to invent a fourth segment
      # (0.1.0.1, 0.1.0.2 ...) when a tag already existed, which is exactly
      # that shape of defect, so it now refuses instead. Releasing again means
      # bumping the version deliberately, in the four files docs/VERSIONING.md
      # lists, which is what a release is.
      - name: Resolve the version, and refuse to guess one
        id: get-version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          echo "Version from tauri.conf.json: $VERSION"

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version the updater can compare."
            exit 1
          fi

          # The four files that must agree. Cargo.lock follows the crate, so it
          # is checked too: a stale lock means the built binary reports a
          # version the release page does not.
          CARGO_VERSION=$(grep -m1 '^version = ' frontend/src-tauri/Cargo.toml | cut -d'"' -f2)
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          LOCK_VERSION=$(awk '/^name = "halvern"$/{getline; print}' Cargo.lock | cut -d'"' -f2)

          mismatch=""
          [ "$CARGO_VERSION" = "$VERSION" ] || mismatch="$mismatch frontend/src-tauri/Cargo.toml=$CARGO_VERSION"
          [ "$PKG_VERSION" = "$VERSION" ]   || mismatch="$mismatch frontend/package.json=$PKG_VERSION"
          [ "$LOCK_VERSION" = "$VERSION" ]  || mismatch="$mismatch Cargo.lock=$LOCK_VERSION"
          if [ -n "$mismatch" ]; then
            echo "::error::Version files disagree with tauri.conf.json ($VERSION):$mismatch"
            echo "See docs/VERSIONING.md — bump the four files together."
            exit 1
          fi

          git fetch --tags --quiet
          if git tag -l "v${VERSION}" | grep -q .; then
            echo "::error::Tag v${VERSION} already exists."
            echo "Bump the version in the four files docs/VERSIONING.md lists, then run this again."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `Halvern v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            console.log(`Created draft release with ID: ${data.id}`)
            return data.id

  # STEP 2: Build all platforms and upload directly to release
  # Note: Linux builds are excluded from release (only macOS and Windows)
  build-all-platforms:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. The Windows entry that used to sit here built a
          # binary nobody has ever run: README says the Windows target is
          # inherited from upstream and unexercised, and shipping it from the
          # release workflow would have contradicted that on the download page.
          # `build.yml` still carries its Windows and Ubuntu branches, and
          # `installer.yml` is how you exercise one without cutting a release.
          #
          # Adding a second entry here is two lines and one trap. Each build
          # job runs `tauri-action` against the same `release-id`, and each one
          # uploads its own `latest.json` describing only the platform it
          # built. The second upload therefore replaces the first, and the
          # release ends up offering updates to exactly one platform — the one
          # that happened to finish last. Nothing fails; the other platform's
          # installations simply never see another update, which is the same
          # silent shape as the version-parsing defect above.
          #
          # The fix belongs in `release-summary`, which already runs after every
          # build and already downloads `latest.json`: rebuild it there from the
          # release's own assets, covering every platform, and re-upload. The
          # per-platform key names are already handled — see
          # `scripts/generate-update-manifest-github.js`, which maps a filename
          # to `darwin-aarch64`, `windows-x86_64` or `linux-x86_64`. What that
          # script cannot do yet is read the signatures back off a release
          # rather than off a local bundle directory.
          - platform: "macos-latest" # for Apple Silicon only (M1 and above)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "halvern"
      upload-artifacts: false  # tauri-action uploads directly to release
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  # STEP 3: Show release summary
  release-summary:
    needs: [create-release, build-all-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A release missing latest.json is not a smaller release, it is a
      # release that never reaches anyone who already installed the app —
      # their update check reads that file and nothing else. Same for the
      # .app.tar.gz and its .sig: the .dmg is what a new visitor downloads,
      # the tarball is what an existing installation applies. Checked here
      # rather than discovered when the next version fails to land.
      - name: Verify the release can actually be downloaded and applied
        id: release-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.create-release.outputs.version }}"
          RELEASE_ID="${{ needs.create-release.outputs.release-id }}"

          ASSETS=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" --jq '.[].name')
          echo "Assets on the release:"
          echo "$ASSETS"

          missing=""
          echo "$ASSETS" | grep -q '\.dmg$'          || missing="$missing .dmg"
          echo "$ASSETS" | grep -q '\.app\.tar\.gz$' || missing="$missing .app.tar.gz"
          echo "$ASSETS" | grep -q '\.sig$'          || missing="$missing .sig"
          echo "$ASSETS" | grep -q '^latest\.json$'   || missing="$missing latest.json"
          if [ -n "$missing" ]; then
            echo "::error::Release v${VERSION} is missing:$missing"
            echo "The updater endpoint reads latest.json from this release; without"
            echo "the tarball and its signature there is nothing for it to apply."
            exit 1
          fi

          {
            echo "## Release v${VERSION}"
            echo ""
            echo "### Files"
            echo '```'
            gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | "\(.name) (\(.size / 1048576 | floor)MB)"'
            echo '```'
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          gh api -H "Accept: application/octet-stream" \
            "repos/${{ github.repository }}/releases/assets/${ASSET_ID}" > latest.json

          {
            echo "### latest.json — what the updater reads"
            echo '```json'
            cat latest.json
            echo '```'
            echo ""
            echo "**Download page:** https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
            echo ""
            echo "**Updater endpoint:** \`releases/latest/download/latest.json\` — served only"
            echo "once this draft is published. Installed copies see the update on their next"
            echo "check; a draft reaches nobody."
          } >> $GITHUB_STEP_SUMMARY

      - name: Next steps
        run: |
          {
            echo "### Next steps"
            echo ""
            echo "1. Review the draft release."
            echo "2. Publish it. Nothing is downloadable and no installation sees the"
            echo "   update while it stays a draft."
            echo "3. Verify on a Mac that has never run Halvern — download the .dmg over"
            echo "   the network, open it, launch the app, and expect no developer"
            echo "   warning. Gatekeeper does not quarantine what was built locally, so"
            echo "   this is the only check that proves the signature. See"
            echo "   docs/SIGNING.md section 4."
            echo "4. Verify the update path from the previous version, once one exists."
          } >> $GITHUB_STEP_SUMMARY
