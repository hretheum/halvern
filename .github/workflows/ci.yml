name: CI

# The gate every change passes before it reaches main.
#
# Until this file existed, every workflow in this repository was
# `workflow_dispatch` — including the one named "pr-main-check", which only
# reads the version out of tauri.conf.json and never compiles anything. Nothing
# ran automatically on a pull request. A contributor could open one, see a clean
# green page, and be told days later that it does not build.
#
# The jobs are deliberately ordered cheapest-first, and `guards` needs no
# toolchain at all, so an obvious mistake fails in under a minute instead of
# after a macOS runner has spent fifteen.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Project guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The language and format checks compare against the merge base, so
          # they need history rather than a shallow clone.
          fetch-depth: 0

      - name: Resolve merge base
        run: echo "BASE_SHA=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the version and its components; rustup
      # installs exactly that. `@stable` used to sit here and floated to
      # whatever shipped that morning, which is how CI came to count 63 clippy
      # warnings against the maintainer's 27. No full build here — this job
      # must stay fast.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - name: Run guards
        run: ./scripts/ci/guards.sh

  rust:
    name: Rust — tests and clippy
    # macOS because the audio path is macOS-specific: ScreenCaptureKit system
    # capture and the CoreAudio tap do not exist on the Linux runners, and a
    # green Linux build would prove nothing about the code that actually runs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by rust-toolchain.toml, deliberately. A warning count is only
      # comparable against the same compiler.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          cargo clippy --version

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: pnpm/action-setup@v6
        with:
          # Must match `packageManager` in frontend/package.json. pnpm honours
          # that field and downgrades itself to it, so a mismatch here does not
          # produce a version error — it produces whatever the field says, and
          # `pnpm-workspace.yaml` is only readable from 10 onwards.
          version: 11
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Tauri resolves `externalBin` at build-script time, so without this file
      # every cargo command fails with "resource path
      # 'binaries/llama-helper-...' doesn't exist" — before compiling a line.
      # It is not part of beforeBuildCommand, so CI has to do it explicitly.
      - name: Build the llama-helper sidecar
        working-directory: frontend
        run: node scripts/build-sidecar.js

      - name: Test
        working-directory: frontend/src-tauri
        run: cargo test --lib

      - name: Clippy (ratchet)
        run: ./scripts/ci/clippy-ratchet.sh

  other-platforms:
    name: Rust — ${{ matrix.name }} compiles
    # The only machines in this project that can answer whether the Windows and
    # Linux targets still compile. A Mac cannot cross-compile either one:
    # whisper-rs-sys and llama-cpp-2 build C++ through CMake against the target's
    # own toolchain, `build.rs` verifies the FFmpeg it downloads by running it,
    # and WiX, NSIS, deb and AppImage all bundle only on their own platform.
    #
    # Both targets broke the same way and for the same reason, which is the
    # argument for running them together: `tauri-plugin-log` sat in the macOS
    # section of Cargo.toml while `build_logger()` used it unconditionally, so
    # every non-macOS build failed at the import. Most of what is left to find
    # is `cfg(not(target_os = "macos"))`, not anything specific to WinAPI or
    # ALSA, and either runner will find it.
    #
    # `cargo check`, not `cargo build`: the point is to catch the next `#[cfg]`
    # mistake, and a full bundle costs several times as long for targets that
    # ship nothing yet. It compiles whisper.cpp and llama.cpp regardless,
    # because build scripts run either way.
    #
    # This started advisory, with `continue-on-error`, because README said
    # neither target had ever been exercised and the job existed to measure
    # that rather than to gate macOS work. Both went green on the first run
    # that ever tried them — 3 September 2026, run 33803622812, Linux in 6m and
    # Windows in 12m — so the measurement is done and the flag is gone. A red
    # job here now means somebody broke a target that was working.
    #
    # Note for whoever reads a green tick above a broken build: with
    # `continue-on-error: true` a job whose steps failed still reports its
    # conclusion as `success`. That is why the first run was checked step by
    # step rather than by its badge.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runs-on: windows-latest
          - name: Linux
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's own Linux prerequisites, plus libasound2-dev because cpal binds
      # ALSA directly and libclang-dev because both whisper-rs-sys and
      # llama-cpp-2 generate their bindings with bindgen. Measured in a clean
      # Ubuntu 24.04 container, not copied from a list: without libclang the
      # build dies in bindgen with "Unable to find libclang", and without
      # webkit2gtk it dies in pkg-config, both from inside a dependency's
      # build script where the cause is not obvious.
      - name: Install Linux system dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev \
            clang libclang-dev cmake patchelf

      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same reason as the macOS job: `externalBin` is resolved by the build
      # script, so a missing sidecar fails before any code is compiled.
      - name: Build the llama-helper sidecar
        working-directory: frontend
        run: node scripts/build-sidecar.js

      - name: Check
        working-directory: frontend/src-tauri
        run: cargo check --lib

  frontend:
    name: Frontend — types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          # Must match `packageManager` in frontend/package.json. pnpm honours
          # that field and downgrades itself to it, so a mismatch here does not
          # produce a version error — it produces whatever the field says, and
          # `pnpm-workspace.yaml` is only readable from 10 onwards.
          version: 11
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: frontend
        run: pnpm run typecheck

      - name: Build
        working-directory: frontend
        run: pnpm run build
