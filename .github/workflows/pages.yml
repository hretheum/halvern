name: Pages

# Publishes `www/` to GitHub Pages.
#
# Branch-based publishing only offers the repository root or `/docs`, and the
# site lives in `www/` while `/docs` holds the project's documentation. So this
# uploads `www/` as an artifact and deploys that, which also keeps the site out
# of the repository root.
#
# The host is part of the site's promise, not an implementation detail. The
# page states it runs no analytics script, sets no cookies and does no
# fingerprinting, and it has no `<script>` tag at all. GitHub Pages keeps that
# true: nothing is injected, and the request logs belong to GitHub rather than
# to us. Moving to a host that offers analytics through a browser beacon would
# make the page's own text false — see docs/OSS_LAUNCH.md.

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'
  # A release changes what the page should say about the download, so the page
  # is rebuilt when one is published. Without this the version and size under
  # the button describe whatever was current the last time somebody edited the
  # HTML, on the one page whose whole argument is that its claims are checkable.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is running: a half-applied
# deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The download button points at `releases/latest`, so it never goes stale
      # — but the line beneath it names a version and a size, and those were
      # typed by hand. They are stamped from the current release here instead.
      #
      # Done at deploy time rather than in the browser: the page carries no
      # script, says so in its own text, and the step below refuses to publish
      # one. A fetch for the version would make that paragraph false.
      - name: Stamp the current release into the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! RELEASE=$(gh api "repos/${{ github.repository }}/releases/latest" 2>/dev/null); then
            echo "No published release yet; leaving the page's own values in place."
            exit 0
          fi

          VERSION=$(echo "$RELEASE" | jq -r '.tag_name' | sed 's/^v//')
          SIZE_BYTES=$(echo "$RELEASE" | jq -r '[.assets[] | select(.name | endswith(".dmg")) | .size] | first // empty')

          if [ -z "$VERSION" ] || [ -z "$SIZE_BYTES" ]; then
            echo "::error::Release has no version or no .dmg asset — refusing to guess."
            exit 1
          fi

          SIZE_MB=$(( (SIZE_BYTES + 524288) / 1048576 ))
          echo "Stamping version $VERSION, ${SIZE_MB} MB"

          # Check the markers exist before substituting, not whether the file
          # changed afterwards. The common case is that the page already says
          # the right thing — a release deploys, then a later push redeploys —
          # and "nothing changed" is success there, not failure. Comparing
          # before and after failed exactly that case the first time it ran.
          for marker in dl-size dl-version; do
            if ! grep -q "<span id=\"$marker\">" www/index.html; then
              echo "::error::www/index.html has no <span id=\"$marker\"> to stamp into."
              exit 1
            fi
          done

          sed -i "s|<span id=\"dl-size\">[^<]*</span>|<span id=\"dl-size\">${SIZE_MB}\&nbsp;MB</span>|" www/index.html
          sed -i "s|<span id=\"dl-version\">[^<]*</span>|<span id=\"dl-version\">${VERSION}</span>|" www/index.html

          # Assert the result rather than the change: this is what the visitor
          # will read.
          if ! grep -q "<span id=\"dl-version\">${VERSION}</span>" www/index.html \
             || ! grep -q "<span id=\"dl-size\">${SIZE_MB}&nbsp;MB</span>" www/index.html; then
            echo "::error::Stamping did not take. Expected version ${VERSION} and ${SIZE_MB} MB."
            exit 1
          fi

          grep -o '<p class="beneath fact">.*</p>' www/index.html

      # Fails the deploy rather than shipping a page that contradicts itself.
      # `check-network-hosts.sh` covers `www/`, but it runs in the CI workflow,
      # which path filters could one day stop firing for a `www/`-only change.
      - name: Refuse to publish a page that runs scripts
        run: |
          if grep -qiE '<script' www/index.html; then
            echo "www/index.html contains a <script> tag."
            echo
            echo "The page tells readers that nothing runs in their browser to"
            echo "watch them, and names the absence of a script as the reason."
            echo "If a script belongs there now, that paragraph has to change"
            echo "first — and this check with it."
            exit 1
          fi
          echo "no scripts in www/index.html"

      # Pages has to be switched on by a human, once, before this can work:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # `enablement: true` was tried here and cannot do it. Creating a Pages
      # site needs administration rights, which GITHUB_TOKEN does not carry
      # whatever `permissions:` asks for — the run failed with "Create Pages
      # site failed. Resource not accessible by integration". Widening the
      # repository's default token permissions would not be worth it for a
      # one-time setup step, so the step stays manual and is written down in
      # docs/OSS_LAUNCH.md.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
