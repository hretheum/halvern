name: Feature request
description: Something Halvern should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        Describe the situation, not the feature. "I record client calls and have
        to redact names before sharing the summary" leads somewhere; "add a
        redaction button" has already picked the answer.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle it now?
      description: A workaround that almost works usually shows where the real seam is.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind, if you have something in mind
      description: Optional. It is fine to bring only the problem.

  - type: checkboxes
    id: constraints
    attributes:
      label: Does this fit the product
      description: |
        Halvern's constraint is that meetings stay on the machine. A feature that
        needs a server is not a small version of one that does not — it is a
        different product. Worth checking before either of us invests in it.
      options:
        - label: This can work without sending meeting content anywhere
        - label: This needs an external service, and I think that trade is worth offering as an explicit opt-in
