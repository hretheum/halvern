# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for Halvern — a Tauri 2 desktop app (Rust core,
# Next.js 16 + React 19 + Tailwind 4 front end) that records, transcribes and
# summarises meetings entirely on the user's machine. Free for public OSS repos.
#
# Scope note, and the most important line here: CodeRabbit **complements the
# deterministic gates in `.github/workflows/ci.yml`, and must not re-litigate
# them**. Five guards (`scripts/ci/guards.sh`) and a clippy ratchet already
# fail a change mechanically. A bot that repeats them adds noise and teaches
# contributors to skim its comments, which is how the useful one gets missed.
# Review what a machine cannot check: whether the change is correct, whether it
# quietly widens what leaves the machine, and whether it assumes a call path
# that does not exist.

language: "en-US"

tone_instructions: >-
  Be concise and direct. Prioritise correctness and the privacy claim over style
  nits. Say what breaks and under what input; skip praise.

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false

  path_filters:
    - "!**/node_modules/**"
    - "!frontend/pnpm-lock.yaml"
    - "!Cargo.lock"
    - "!**/*.snap"
    # Generated by `pnpm tauri` and by the design export; not authored here.
    - "!frontend/src-tauri/gen/**"
    - "!design/tokens/**"
    # Bake-off fixtures are deliberate multilingual test data, including the
    # Polish and Japanese corpora. Reviewing them produces language nits about
    # content that is correct by construction.
    - "!docs/experiments/**/corpus/**"

  path_instructions:
    - path: "frontend/src-tauri/src/audio/**"
      instructions: >-
        The audio path is the heart of the product and the source of every
        serious defect in this repository. Two rules. First: a registered Tauri
        command, a `pub` item or a re-export is NOT proof of a call path —
        check `generate_handler!` in `lib.rs` and the frontend `invoke(...)`
        sites before treating code here as live, and say so when a change
        assumes reachability it has not shown. Several subsystems in this
        directory look wired and are not; CLAUDE.md gotcha 8 lists them.
        Second: flag anything that changes sampling, resampling, chunk sizes,
        VAD timing or mixing as a behaviour change needing evidence from a real
        recording, however cosmetic the diff looks. A "tidy-up" here once
        turned 160 ms into 159.999996 ms by routing an f64 through f32.
    - path: "frontend/src-tauri/src/summary/**"
      instructions: >-
        Summarisation can run locally or against a user-configured provider.
        Flag any code path that reaches a network provider without the user
        having configured it, any default that is not "local", and any prompt
        or transcript content added to a log line — transcripts are the most
        sensitive data this app holds.
    - path: "frontend/src-tauri/src/analytics/**"
      instructions: >-
        Telemetry is compile-time optional and off by default. The endpoint
        comes from `option_env!`, and the client is constructed only when a key
        is present and consent is given. Flag ANY change that constructs a
        client unconditionally, defaults consent to true, moves the endpoint to
        a runtime value, or sends a field that was not sent before. README asks
        readers to verify these exact properties in the source; a change here
        makes the README wrong.
    - path: "scripts/ci/**"
      instructions: >-
        These are the gates. They must fail loud — non-zero exit on any
        violation — and never silently pass. Flag swallowed errors, empty catch
        blocks, `|| true` on a pipeline whose exit code matters, and early
        returns that mask a failure. One of these scripts shipped for months
        counting warnings while `|| true` ate the exit code of the command
        producing them, so the ratchet reported success on a build that never
        finished.
    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: >-
        Next.js 16 with static prerender. Layout that must be correct at first
        paint cannot depend on a client-side hook — `navigator` and `window` do
        not exist during prerender, and a hook that reads them yields the wrong
        branch on the first frame. Flag disabled controls that rely on colour
        or opacity alone to signal state, and any text whose contrast comes
        from opacity rather than a token.
    - path: "www/**"
      instructions: >-
        The landing page states in public that it carries no analytics script,
        no cookies and no fingerprinting. Flag any script tag, any external
        request, any cookie, and any claim about the product that the source
        does not support.
    - path: "**/*.{md,yaml,yml,toml,json}"
      instructions: >-
        Docs and config. Flag broken internal links, stale line references and
        claims that no longer match the code. Product name is Halvern;
        "Meetily" belongs only in attribution to the upstream project.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "github-actions[bot]"
      - "dependabot[bot]"

  # Only the linters this stack actually uses. The rest stay off so a review is
  # about the change rather than about tooling that does not apply here.
  tools:
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    shellcheck:
      enabled: true
    eslint:
      enabled: true
    biome:
      enabled: false
    ruff:
      enabled: false
    rubocop:
      enabled: false
    golangci-lint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "PRIVACY_POLICY.md"
      - "docs/**/*.md"
