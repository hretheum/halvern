<!-- Source artwork for the application icon. `tauri icon` rasterises this into
     every platform size, so it is the only file to edit when the icon changes.

     The mark is bronze on ink rather than the reverse: a dock icon has to hold
     against both a light and a dark desktop, and the dark field does that where
     a stone one would disappear on a light wallpaper. The mark occupies 50% of
     the canvas, which is the conventional inset for macOS artwork — filling the
     square would leave no optical margin once the OS rounds the corners. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="230" fill="#1E1C18"/>
  <g transform="translate(256, 256) scale(25.6)">
    <path d="M17 0C18.6569 0 20 1.34315 20 3V19C20 19.5523 19.5523 20 19 20H14.0557C14.2608 19.4209 14.375 18.7882 14.375 18.125C14.375 15.3636 12.4162 13.125 10 13.125C7.58375 13.125 5.625 15.3636 5.625 18.125C5.625 18.7882 5.73916 19.4209 5.94434 20H1C0.447715 20 8.05326e-09 19.5523 0 19V3C0 1.34315 1.34315 6.44255e-08 3 0H17Z" fill="#C07A3A"/>
  </g>
</svg>
