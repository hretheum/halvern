[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Declared here, and only here, because it is a `links` crate: `whisper-rs-sys`
# claims the native library `whisper`, and cargo refuses a graph holding two
# packages that both claim it. It used to be stated three times, once per
# platform, all at the same version — which is fine until Dependabot bumps one
# of the three and leaves the others, and every Cargo run then dies with
#
#   package `whisper-rs-sys` links to the native library `whisper`, but it
#   conflicts with a previous package which links to `whisper` as well
#
# That took the whole Cargo ecosystem down with it: ten unrelated crates came
# back `dependency_file_not_resolvable` every Monday because the manifest could
# not be resolved at all. One version string cannot disagree with itself.
#
# Platform acceleration is additive on top of this, in the member's own
# target sections. `raw-api` is needed everywhere.
whisper-rs = { version = "0.13.2", features = ["raw-api"] }

# Profiles are read from the workspace root and nowhere else. A `[profile.*]`
# section in a member manifest is ignored — cargo says so on every command and
# nobody was reading it, so `llama-helper` had been building on the default
# release profile since it was written.
#
# `opt-level` and `codegen-units` can be set per package. `lto` cannot: it is a
# whole-profile setting, so honouring the sidecar's original `lto = true` would
# have applied it to the application as well. That is a build-time and
# performance change worth measuring on its own, not a side effect of moving a
# section, so it is deliberately not carried over.
[profile.release.package.llama-helper]
opt-level = "s"    # loaded per summary; startup size costs more here than throughput
codegen-units = 1
